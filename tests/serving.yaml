apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: canary-serving-template
  annotations:
    scenarios.ai.sap.com/name: "Infrastructure Canary Test"
    executables.ai.sap.com/name: "canary-serving-executable"
    executables.ai.sap.com/description: "Minimal serving template to verify SAP control plane health"
  labels:
    scenarios.ai.sap.com/id: "canary-scenario"
    executables.ai.sap.com/id: "canary-serving-executable"
    ai.sap.com/version: "1.0.0"
spec:
  inputs:
    parameters: []
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    metadata:
      annotations: |
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: 1
        autoscaling.knative.dev/targetBurstCapacity: 0
      labels: |
        ai.sap.com/resourcePlan: starter
    spec: |
      predictor:
        minReplicas: 1
        maxReplicas: 1
        containers:
          - name: kserve-container
            image: "docker.io/kennethreitz/httpbin:latest"
            imagePullPolicy: Always
            ports:
              - containerPort: 80
                protocol: TCP