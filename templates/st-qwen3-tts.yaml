apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: qwen3-tts-I772784
  annotations:
    scenarios.ai.sap.com/id: "scenario-qwen3-tts-I772784"
    scenarios.ai.sap.com/name: "scenario_qwen3_tts-I772784"
    executables.ai.sap.com/name: "qwen3-tts-I772784"
    executables.ai.sap.com/description: "Qwen3-TTS Text-to-Speech inference server"
  labels:
    scenarios.ai.sap.com/id: "scenario-qwen3-tts-I772784"
    executables.ai.sap.com/id: "qwen3-tts-I772784"
    ai.sap.com/version: "1.0.0"
spec:
  inputs:
    parameters: []
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    metadata:
      labels: |
        ai.sap.com/resourcePlan: infer.l
    spec: |
      predictor:
        minReplicas: 1
        maxReplicas: 1
        containers:
          - name: kserve-container
            image: jeremee02/qwen3-tts:0.0.6
            ports:
              - containerPort: 9001
                protocol: TCP
            env:
              - name: HF_HOME
                value: "/mnt/models/.cache"
              - name: TRANSFORMERS_CACHE
                value: "/mnt/models/.cache"
              - name: TORCH_HOME
                value: "/mnt/models/.cache/torch"
              - name: MODEL_ID
                value: "Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice"
              - name: DEVICE
                value: "cuda:0"
              - name: NUMBA_CACHE_DIR
                value: "/tmp"
              - name: NUMBA_DISABLE_JIT
                value: "1"
              - name: MPLCONFIGDIR
                value: "/tmp"
            resources:
              limits:
                nvidia.com/gpu: "1"
                memory: "32Gi"
                cpu: "8"
              requests:
                nvidia.com/gpu: "1"
                memory: "16Gi"
                cpu: "4"
